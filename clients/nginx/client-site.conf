# nginx server block for a static client site (Astro build, one per tenant).
#
# The sites are plain static files: every existing page is a directory with an
# index.html (e.g. /Helfen/ -> Helfen/index.html). Unknown URLs must NOT fall back to
# /index.html (that is the SPA pattern of the admin UI) - otherwise every typo shows
# the start page with status 200. Instead they get the site's own 404.html with status 404.
#
# Replace <tenant> and the server_name. The root is the symlink the backend swaps on
# every "Seite bauen" (see sheltify-backend/handlers/build-trigger-handler.go).

server {
    listen 80;
    server_name example.de www.example.de;

    root /var/www/sheltify/client-<tenant>;
    index index.html;

    location / {
        # NOT: try_files $uri $uri/ /index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # Astro builds src/pages/404.astro to /404.html
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
