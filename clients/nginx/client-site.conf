# nginx server block for a static client site (Astro build, one per tenant).
#
# The sites are plain static files: every existing page is a directory with an
# index.html (e.g. /Helfen/ -> Helfen/index.html). Unknown URLs must NOT fall back to
# /index.html (that is the SPA pattern of the admin UI) - otherwise every typo shows
# the start page with status 200. Instead they get the site's own 404.html with status 404.
#
# Replace <tenant> and the server_name. The root is the symlink the backend swaps on
# every "Seite bauen" (see sheltify-backend/handlers/build-trigger-handler.go).

server {
    listen 80;
    server_name example.de www.example.de;

    # On the https server block (certbot): "listen 443 ssl;" plus "http2 on;" -
    # browsers only use http/2 over https, and it loads the many images in parallel.

    root /var/www/sheltify/client-<tenant>;
    index index.html;

    # nginx only compresses text/html by default
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Astro puts a content hash into every file name in /_astro/, so they never change
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # NOT: try_files $uri $uri/ /index.html;
        try_files $uri $uri/ $uri.html =404;
    }

    # The article preview in the cms (other origin) loads provided-article-theme.css from this site,
    # and browsers only use fonts referenced there with a CORS header. These font requests are sent
    # without credentials, so on sites protected by basic auth (e.g. test sites) fonts must be excluded from it.
    location ~* \.(woff2?|ttf|otf)$ {
        auth_basic off;
        add_header Access-Control-Allow-Origin "https://editor.sheltify.de" always;
        try_files $uri =404;
    }

    # Astro builds src/pages/404.astro to /404.html
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
