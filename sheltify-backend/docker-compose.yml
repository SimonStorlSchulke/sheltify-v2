version: '3.8'
services:
  postgres:
    image: postgres:17
    container_name: sheltify_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5434:5432"
    volumes:
      - sheltify:/var/lib/postgresql/data

volumes:
  sheltify:
