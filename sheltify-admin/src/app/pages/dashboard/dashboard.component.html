<div class="dashboard sui p-3 flex-y gap-3">
  <header class="sui flex-y gap-2">
    <div>
      <h1>{{ tenantConfigurationService.config()?.Name }}</h1>
      @if (authService.user$ | async; as user) {
        <h2>{{ greeting }}, {{ user.Name }}!</h2>
      }
    </div>
    @if (siteUrl(); as url) {
      <a class="site-link" [href]="url" target="_blank" rel="noopener">
        <app-bt-icon name="BoxArrowUpRight" size="s"/> Website öffnen
      </a>
    }
  </header>

  <div class="columns">
    <section class="card"><app-attention-list/></section>
    <section class="card"><app-recent-forms/></section>
    <section class="card"><app-recently-edited/></section>
    <section class="card"><app-home-found-overview/></section>
  </div>
</div>
