<div class="sui flex-x wrap gap-1">
  <button class="primary" data-testid="dashboard-new-animal" (click)="newAnimal()">
    <app-bt-icon name="Plus" size="s"/> Neues Tier
  </button>
  <button class="secondary" data-testid="dashboard-new-blog" (click)="newBlog()">
    <app-bt-icon name="Plus" size="s"/> Neuer Blogeintrag
  </button>
  <button class="secondary" routerLink="/media">
    <app-bt-icon name="CardImage" size="s"/> Medien
  </button>
  <button class="secondary" routerLink="/tiertabelle">
    <app-bt-icon name="Table" size="s"/> Tiertabelle
  </button>
  @if (siteUrl(); as url) {
    <a class="site-link" [href]="url" target="_blank" rel="noopener">
      <app-bt-icon name="BoxArrowUpRight" size="s"/> Website öffnen
    </a>
  }
</div>
