@let formsValue = forms();

<div class="sui flex-x jc-space-between ai-center mb-1">
  <h2>Formulare</h2>
  <a routerLink="/formulare" class="text-meta">alle anzeigen</a>
</div>
<div class="sui flex-y">
  @if (formsValue) {
    @for (form of formsValue; track form.ID) {
      <a [routerLink]="['/formulare', form.ID]" class="sui flex-x gap-2 ai-center list-entry" [class.unread]="isUnread(form)">
        @if (isUnread(form)) {
          <span class="badge" title="noch nicht gelesen">neu</span>
        }
        <span>{{ form.Type }}</span>
        <span class="mail" [title]="form.SenderMail">{{ form.SenderMail }}</span>
        <span class="text-meta date">{{ form.CreatedAt | date : "dd.MM.yyyy - HH:mm" }}</span>
      </a>
    } @empty {
      <i>Keine Formulare in den letzten 14 Tagen</i>
    }
  }
</div>
