<app-left-sidebar-layout #layout>
  <div class="sidebar">
    <div class="sui flex-x gap-2">
      <h1>Blogeinträge</h1>
      <div class="sui grow-1"></div>
      <button data-testid="btn-new-blog" class="primary" (click)="newBlog(); layout.mobileOpen.set(true)">Neuer Post</button>
    </div>
    <br>

    @if(this.blogCategories().length > 2) { <!-- 2 because 'alle' is an option -->
      <app-radio-buttons-input class="sui mb-1" idName="selectedCategory" [(twoWayModel)]="selectedCategory" label="" [options]="blogCategories()" />
    }

    <div class="sui flex-y">
      @for (blog of blogs(); track blog) {
        <div [class.selected]="selectedBlog()?.ID == blogs()[$index].ID" class="list-entry sui p-1 flex-x" (click)="toBlog(blog.ID); layout.mobileOpen.set(true)">
          {{ blog.Title }}
          @if (!blog.PublishedAt?.Valid) {
            <app-bt-icon style="display: inline-block" class="sui ml-1" name="PencilFill" size="s"/>
          }
          <div class="sui grow-1"></div>
          <i>{{blog.Category}}</i>
        </div>
      }
    </div>

  </div>
  @if (selectedBlog(); as blog) {
    <app-blog-editor (deleted)="onDeleted(); layout.mobileOpen.set(false)" [blog]="blog" class="content"/>
  }
</app-left-sidebar-layout>
