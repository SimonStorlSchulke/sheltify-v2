<div class="NgxEditor__Wrapper">
  <ngx-editor-menu [editor]="editor" [toolbar]="toolbar" [customMenuRef]="customMenu">aaa</ngx-editor-menu>

  <ngx-editor
    [editor]="editor"
    [ngModel]="html"
    (ngModelChange)="onChange($event)"
    (input)="markDirty()"
    (paste)="markDirty()"
    [placeholder]="'Text eingeben...'">
  </ngx-editor>
</div>


<ng-template #customMenu>
  <button type="button" class="small primary" (mousedown)="addButtonLink($event)">
    Linkbutton
  </button>
  <button type="button" class="small primary sui mx-1" (mousedown)="addAnimalLink($event)">
    Tierlink
  </button>
  <select class="small tenant-placeholder-select" title="Feld aus der Vereinskonfiguration einfügen. Es wird auf der Webseite durch den aktuellen Wert ersetzt."
          (change)="insertTenantPlaceholder($any($event.target))">
    <option value="">Vereinsfeld einfügen</option>
    @for (field of tenantPlaceholderFields; track field.key) {
      <option [value]="field.key">{{ field.label }}</option>
    }
  </select>
</ng-template>
