<app-checkbox-input idName="fulLWidth" label="Ganze Breite einnehmen" explanation="Nutzt die ganze Breite des Bildschirms und lässt keinen Rand an den Seiten" [(twoWayModel)]="section().Content.FullWidth"/>
<br>

@if(editedSection(); as editedSectionVal) {
  <div class="column-section-editor">
    <app-section-editor-column-sections
      class="sui card flex-y"
      [section]="editedSectionVal.section"
      (apply)="applyEditedSection(editedSectionVal.iCol, editedSectionVal.iRow)"
      (deletedSection)="deleteSection(editedSectionVal.iCol, editedSectionVal.iRow)"
    />
  </div>
}

<div class="columns sui flex-x">
  @for (column of section().Content.Columns; track column) {
    @let iCol = $index;
    <div class="column" [style.flex]="`${column.Grow} 1 0px`">

      <div class="column-header sui p-1 flex-x gap-2 ai-center">
        <b>Platz</b>
        <app-number-input idName="grow" label="" [(twoWayModel)]="column.Grow"/>
        <div class="button-group">
          <button class="small"><app-bt-icon (click)="moveColumnLeft(iCol)" name="ChevronLeft"/></button>
          <button class="small"><app-bt-icon (click)="moveColumnRight(iCol)" name="ChevronRight"/></button>
          <button class="small"><app-bt-icon (click)="deleteColumn($index)" name="X"/></button>
        </div>
      </div>

      <div class="column-sections">
        <div (click)="addSectionAtRow(iCol, 0)" [attr.data-testid]="'row-selector-' + $index + 1" class="move-to-row"></div>

        @for (section of column.Sections; track section) {
          @let iRow = $index;
          <div class="section-preview themable article" (click)="editSection(section, iCol, iRow)">
            <app-section-renderer [section]="section"/>
          </div>

          <div (click)="addSectionAtRow(iCol, iRow + 1)" [attr.data-testid]="'row-selector-' + $index + 1" class="move-to-row"></div>
        }
      </div>
    </div>
  }
  <button (click)="addColumn()" class="add-column secondary small sui flex-x ai-center">
    <app-bt-icon class="" name="Plus"/>
  </button>
</div>
