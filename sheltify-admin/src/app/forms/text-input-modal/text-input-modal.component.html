<div class="sui flex-y gap-2">
  <p>{{ label }}</p>
  @if (long) {
    <textarea
      [value]="presetText"
      #input
      [placeholder]="placeHolder"
      style="height: min(50dvh, 300px); width: min(70dvh, 400px)"
    ></textarea>
  } @else {
    <input
      [value]="presetText"
      #input
      type="text"
      [placeholder]="placeHolder"
    />
  }
  <div class="sui flex-x gap-2 jc-end">
    <button data-testid="btn-cancel" (click)="cancel()">Abbrechen</button>
    <button class="primary" data-testid="btn-submit" (click)="finishWithInputValue()">OK</button>
  </div>
</div>
