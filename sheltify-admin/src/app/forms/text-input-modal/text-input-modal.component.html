<div class="sui flex-y gap-2">
  <p>{{ label }}</p>
    <textarea
      [value]="presetText"
      #input
      type="text"
      [placeholder]="placeHolder"
      [style.height]="long ? 'min(50dvh, 300px)' : ''"
      [style.width]="long ? 'min(70dvh, 400px)' : ''"
    ></textarea>
  <div class="sui flex-x gap-2 jc-end">
    <button data-testid="btn-cancel" (click)="cancel()">Abbrechen</button>
    <button class="primary" data-testid="btn-submit" (click)="finishWith(input.value)">OK</button>
  </div>
</div>
